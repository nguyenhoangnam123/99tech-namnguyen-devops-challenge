name: p1-exchange

on:
  pull_request:
    paths: ['src/problem1/**', '.github/workflows/p1-exchange.yml']
  push:
    branches: [main]
    paths: ['src/problem1/**', '.github/workflows/p1-exchange.yml']

permissions:
  contents: read

concurrency:
  group: p1-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/problem1

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  static:
    name: Lint, types, contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/problem1/.nvmrc
          cache: npm
          cache-dependency-path: src/problem1/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - name: Generated code matches contracts
        run: make check-gen
      - name: No breaking change to event contracts
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npx buf breaking contracts --against "../../.git#branch=origin/$BASE_REF,subdir=src/problem1/contracts"
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

  unit:
    name: Unit and property tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/problem1/.nvmrc
          cache: npm
          cache-dependency-path: src/problem1/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Integration tests against Postgres
        run: npm run test:integration

  stack:
    name: E2E, chaos, abuse, ZAP, load smoke
    needs: [static, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/problem1/.nvmrc
          cache: npm
          cache-dependency-path: src/problem1/package-lock.json
      - run: npm ci
      - name: Start the stack
        run: make up
      - name: Secret scan
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --no-banner --redact
      - name: Image scan (fixable HIGH and CRITICAL fail the build)
        run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.76.2
          image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed exchange:local
      - run: make e2e
      - run: make chaos
      - name: Abuse suite and ZAP API scan
        run: make security
      # A 4-vCPU shared runner hosts 12 containers, so it runs the same mix at
      # 100 rps as a regression check. 500 rps is judged on dedicated hardware.
      - name: Load smoke (100 rps, same mix)
        continue-on-error: true
        run: make perf DURATION=1m RATE_SCALE=0.2
      - name: Service logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: p1-reports
          path: src/problem1/reports/
          if-no-files-found: ignore
