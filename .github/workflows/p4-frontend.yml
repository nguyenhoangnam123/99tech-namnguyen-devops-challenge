name: p4-frontend

# Pull requests: verify and build. main: build once, store the bundle,
# then publish that bundle to staging and, after approval, production.
on:
  pull_request:
    paths:
      - src/problem4/apps/frontend/**
      - src/problem4/scripts/**
      - .github/workflows/p4-frontend.yml
      - .github/workflows/p4-deploy-frontend.yml
  push:
    branches: [main]
    paths:
      - src/problem4/apps/frontend/**
      - src/problem4/scripts/**
      - .github/workflows/p4-frontend.yml
      - .github/workflows/p4-deploy-frontend.yml

permissions:
  contents: read

concurrency:
  group: p4-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: src/problem4/apps/frontend

jobs:
  build:
    name: Lint, types, tests, bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: src/problem4/.nvmrc
          cache: npm
          cache-dependency-path: src/problem4/apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Bundle
        run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-${{ github.sha }}
          path: src/problem4/apps/frontend/dist/
          retention-days: 7
      - name: Sign in to AWS as the build role
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Store the bundle
        if: github.event_name == 'push'
        run: ../../scripts/upload-frontend.sh "$GITHUB_SHA" dist

  staging:
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/p4-deploy-frontend.yml
    with:
      environment: staging
      version: ${{ github.sha }}

  production:
    needs: staging
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/p4-deploy-frontend.yml
    with:
      environment: production
      version: ${{ github.sha }}
