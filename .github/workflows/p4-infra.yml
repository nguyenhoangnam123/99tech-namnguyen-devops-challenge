name: p4-infra

# Static checks, then Terratest plans with a read-only role. Applies run
# from an operator's machine with reviewed plans; see SOLUTION.md.
on:
  pull_request:
    paths: ['src/problem4/infra/**', '.github/workflows/p4-infra.yml']
  push:
    branches: [main]
    paths: ['src/problem4/infra/**', '.github/workflows/p4-infra.yml']

permissions:
  contents: read

concurrency:
  group: p4-infra-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: src/problem4/infra

jobs:
  check:
    name: fmt, validate, tflint, checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: terraform fmt -check -recursive
      - name: Validate every stack
        run: |
          for stack in bootstrap shared env; do
            terraform -chdir="$stack" init -backend=false -input=false >/dev/null
            terraform -chdir="$stack" validate
          done
      - name: tflint
        run: tflint --recursive
      - name: checkov
        run: >-
          docker run --rm -v "$PWD:/infra" bridgecrew/checkov:3.4.5
          --config-file /infra/.checkov.yaml -d /infra
          --external-checks-dir /infra/policies

  plan-tests:
    name: Terratest plans
    needs: check
    # Skipped until the plan role exists, and for forks, which get no OIDC token.
    if: >-
      vars.AWS_PLAN_ROLE_ARN != '' && (github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.11.0
          terraform_wrapper: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/problem4/infra/test/go.mod
          cache-dependency-path: src/problem4/infra/test/go.sum
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Plan every stack and check its invariants
        working-directory: src/problem4/infra/test
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/terraform-plugins
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          go vet ./...
          go test -count=1 -timeout 15m ./...
