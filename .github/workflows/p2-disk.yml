name: p2-disk

on:
  pull_request:
    paths: ['src/problem2/**', '.github/workflows/p2-disk.yml']
  push:
    branches: [main]
    paths: ['src/problem2/**', '.github/workflows/p2-disk.yml']

permissions:
  contents: read

concurrency:
  group: p2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lab:
    name: shellcheck, then each full-disk scenario
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/problem2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 scripts/triage.sh lab/run.sh lab/scenario.sh
      # The LVM scenario needs a privileged container and a loop device; it
      # stays a local, opt-in run.
      - name: Lab scenarios
        run: lab/run.sh
