# Local stand-in for CloudFront + ALB: path routing, a coarse per-IP
# backstop and timeouts. Per-user limits live in the services.
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
}

http {
  server_tokens off;
  # Docker DNS; re-resolve so recreated containers are picked up.
  resolver 127.0.0.11 valid=5s ipv6=off;

  log_format edge escape=json '{"time":"$time_iso8601","request_id":"$request_id",'
    '"client":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
    '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"}';
  access_log /dev/stdout edge buffer=32k flush=1s;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=per_ip:10m rate=1000r/s;
  limit_conn_zone $binary_remote_addr zone=ws_per_ip:10m;
  limit_req_status 429;

  upstream oms {
    zone oms 64k;
    server oms-api:3000 resolve;
    keepalive 64;
  }

  upstream marketdata {
    zone marketdata 64k;
    server marketdata:3000 resolve;
    keepalive 64;
  }

  server {
    listen 8080;
    client_max_body_size 16k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Cache-Control no-store always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    # First hop: overwrite, never append, or clients can spoof their IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    # Without this, nginx answers /v1 with an HTML redirect to /v1/.
    location = /v1 {
      return 404;
    }

    location = /healthz {
      access_log off;
      return 200 'ok';
    }

    # A location with its own proxy_set_header inherits none from the server.
    location = /v1/ws {
      limit_conn ws_per_ip 20;
      proxy_pass http://marketdata;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 1h;
    }

    location /v1/markets {
      limit_req zone=per_ip burst=500 nodelay;
      proxy_pass http://marketdata;
    }

    location /v1/ {
      limit_req zone=per_ip burst=500 nodelay;
      proxy_pass http://oms;
    }

    # Service health and metrics endpoints stay internal.
    location / {
      return 404;
    }

    # Errors raised by the edge itself keep the API's problem format.
    error_page 404 = @not_found;
    error_page 413 = @too_large;
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    location @not_found {
      default_type application/problem+json;
      return 404 '{"type":"about:blank","title":"not found","status":404,"code":"NOT_FOUND"}';
    }

    location @too_large {
      default_type application/problem+json;
      return 413 '{"type":"about:blank","title":"payload too large","status":413,"code":"PAYLOAD_TOO_LARGE"}';
    }

    location @rate_limited {
      default_type application/problem+json;
      return 429 '{"type":"about:blank","title":"rate limited","status":429,"code":"RATE_LIMITED"}';
    }

    location @unavailable {
      default_type application/problem+json;
      return 503 '{"type":"about:blank","title":"unavailable","status":503,"code":"UNAVAILABLE"}';
    }
  }
}
