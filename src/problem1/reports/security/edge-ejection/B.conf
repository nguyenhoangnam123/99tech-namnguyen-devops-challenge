events {}
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream oms { zone oms 64k; server app:3000 resolve max_fails=0; keepalive 8; }
  server {
    listen 8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 1s; # 10 s on the real edge; shortened to keep the run fast
    location / { proxy_pass http://oms; }
  }
}
