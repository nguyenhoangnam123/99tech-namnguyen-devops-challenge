# Statements split over lines, sharing a line, and a quoted include.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m
                 max_size=32m inactive=1d use_temp_path=off;
server { listen 80; access_log /var/log/mid/access.log; location / { proxy_pass http://127.0.0.1:8081; } }
include "/etc/nginx/extra/*.conf";
