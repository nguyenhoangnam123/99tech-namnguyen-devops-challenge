# max_size sized to the whole volume: once full, the disk stays at about 99%.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=63m inactive=1d use_temp_path=off;
server {
    listen 80;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache api;
        proxy_cache_valid 200 1d;
    }
}
