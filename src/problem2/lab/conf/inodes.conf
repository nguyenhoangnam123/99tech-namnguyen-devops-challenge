# max_size bounds bytes only; every small response still takes an inode.
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api:10m max_size=48m inactive=1d use_temp_path=off;
server {
    listen 80;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_cache api;
        proxy_cache_valid 200 1d;
    }
}
