server {
    listen 80;

    # Ask Docker's DNS again every 5 s: a recreated API gets a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api;
        # The API gives up after 8 s (2 s pool wait, 6 s query), so 10 s is safe.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

}
