server {
    listen 80;

    # Ask Docker's DNS again every 5 s: a recreated API gets a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api;
        # Above the API's own 8 s budget: 2 s pool wait, 6 s query.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

}
