server {
    listen 80;

    # Ask Docker's DNS again every 5 s: a recreated API gets a new address.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:3000;

    location = / {
        return 200 "Welcome to the platform\n";
    }

    location /api/ {
        proxy_pass $api;
    }

}
